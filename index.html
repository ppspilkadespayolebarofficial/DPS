<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Data Pemilih</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f8fafc; font-family: sans-serif; }
        .card-custom { border: none; border-radius: 12px; background: #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .chart-box { position: relative; height: 200px; }
        .nkk-group-border td { border-top: 2.5px solid #0f172a !important; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <!-- 3 GRAFIK UTAMA -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card card-custom p-3 text-center">
                    <h6 class="fw-bold">Jenis Kelamin</h6>
                    <div class="chart-box"><canvas id="chartJK"></canvas></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-custom p-3 text-center">
                    <h6 class="fw-bold">Status Perkawinan</h6>
                    <div class="chart-box"><canvas id="chartStatus"></canvas></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-custom p-3 text-center">
                    <h6 class="fw-bold">Kelompok Usia</h6>
                    <div class="chart-box"><canvas id="chartUmur"></canvas></div>
                </div>
            </div>
        </div>

        <!-- TABEL DATA -->
        <div class="card card-custom p-4">
            <div class="d-flex justify-content-between mb-3">
                <button class="btn btn-dark btn-sm" onclick="window.print()">Cetak / Print PDF</button>
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>NO</th><th>DP-ID</th><th>NKK</th><th>NIK</th><th>NAMA</th>
                            <th>TEMPAT/TGL LAHIR</th><th>UMUR</th><th>JK</th><th>STS</th><th>ALAMAT</th><th>RT</th>
                            <th>KETERANGAN</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let rawData = [];
        window.addEventListener('DOMContentLoaded', () => {
            fetch('data.xlsx').then(res => res.arrayBuffer()).then(buffer => {
                const wb = XLSX.read(buffer, { type: 'array' });
                rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                renderTable();
                initCharts();
            });
        });

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = rawData.map((row, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td class="text-danger fw-bold">${row['DP-ID']||row['DP_ID']||'-'}</td>
                    <td class="fw-bold">${row['NKK']||'-'}</td>
                    <td>${row['NIK']||'-'}</td>
                    <td class="fw-bold">${row['NAMA']||'-'}</td>
                    <td>${row['TEMPAT LAHIR']||''}, ${row['TANGGAL LAHIR']||''}</td>
                    <td>${row['USIA']||row['UMUR']||'-'}</td>
                    <td>${row['JENIS KELAMIN']||row['JK']||'-'}</td>
                    <td>${row['STS KAWIN']||row['STS']||'-'}</td>
                    <td>${row['ALAMAT']||row['DUSUN/ALAMAT']||'-'}</td>
                    <td>${row['RT']||'-'}</td>
                    <td></td>
                </tr>
            `).join('');
        }

        function initCharts() {
            new Chart(document.getElementById('chartJK'), {
                type: 'doughnut',
                data: { labels: ['Laki-Laki', 'Perempuan'], datasets: [{ data: [12, 15], backgroundColor: ['#3b82f6', '#ec4899'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
            new Chart(document.getElementById('chartStatus'), {
                type: 'doughnut',
                data: { labels: ['Sudah', 'Belum', 'Pernah'], datasets: [{ data: [20, 5, 2], backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
            new Chart(document.getElementById('chartUmur'), {
                type: 'bar',
                data: { labels: ['<20', '20-39', '40-59', '>=60'], datasets: [{ data: [5, 12, 8, 2], backgroundColor: '#10b981' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard & Filter Data Pemilih</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #334155;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background: #ffffff;
            margin-bottom: 20px;
        }
        .filter-header {
            color: #1e293b;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .table-container {
            overflow-x: auto;
        }
        .table th {
            background-color: #f1f5f9;
            color: #475569;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }
        .table td {
            font-size: 0.85rem;
            vertical-align: middle;
            white-space: nowrap;
        }
        .badge-jk-l { background-color: #dbeafe; color: #1e40af; }
        .badge-jk-p { background-color: #fce7f3; color: #9d174d; }
        .badge-sts { background-color: #f3e8ff; color: #6b21a8; }
        .badge-ket { background-color: #e0e7ff; color: #3730a3; }
        .text-dp-id { color: #ef4444; font-weight: 600; }
        .chart-box {
            position: relative;
            height: 220px;
        }
    </style>
</head>
<body class="py-4">

    <div class="container-fluid px-4">
        
        <!-- DASHBOARD RINGKASAN DATA (CHARTS) -->
        <div class="row">
            <div class="col-md-3">
                <div class="card card-custom p-3 text-center">
                    <h6 class="text-muted fw-bold mb-2">Jenis Kelamin</h6>
                    <div class="chart-box">
                        <canvas id="chartJK"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-custom p-3 text-center">
                    <h6 class="text-muted fw-bold mb-2">Status Perkawinan</h6>
                    <div class="chart-box">
                        <canvas id="chartStatus"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-custom p-3 text-center">
                    <h6 class="text-muted fw-bold mb-2">Kelompok Usia</h6>
                    <div class="chart-box">
                        <canvas id="chartUmur"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-custom p-3 text-center">
                    <h6 class="text-muted fw-bold mb-2">Sebaran TPS</h6>
                    <div class="chart-box">
                        <canvas id="chartKet"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL FILTER -->
        <div class="card card-custom p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="filter-header"><i class="fa-solid fa-filter text-primary me-2"></i>Filter Data Pemilih</span>
                <div>
                    <button class="btn btn-dark btn-sm me-1" onclick="window.print()"><i class="fa-solid fa-print me-1"></i> Cetak / Print PDF</button>
                    <button class="btn btn-success btn-sm me-1" onclick="exportExcel()"><i class="fa-solid fa-file-excel me-1"></i> Export Excel</button>
                    <button class="btn btn-info btn-sm text-white" onclick="exportCSV()"><i class="fa-solid fa-file-csv me-1"></i> Export CSV</button>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold">CARI (NAMA/NIK/NKK/ALAMAT/DP-ID)</label>
                    <input type="text" id="filterCari" class="form-control form-control-sm" placeholder="Ketik kata kunci..." oninput="applyFilter()">
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-bold">JENIS KELAMIN</label>
                    <select id="filterJK" class="form-select form-select-sm" onchange="applyFilter()">
                        <option value="">-- Semua --</option>
                        <option value="L">Laki-Laki</option>
                        <option value="P">Perempuan</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-bold">PILIH RT</label>
                    <select id="filterRT" class="form-select form-select-sm" onchange="applyFilter()">
                        <option value="">-- Semua RT --</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-bold">PILIH TPS</label>
                    <select id="filterKet" class="form-select form-select-sm" onchange="applyFilter()">
                        <option value="">-- Semua TPS --</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-bold">STATUS KAWIN</label>
                    <select id="filterStatus" class="form-select form-select-sm" onchange="applyFilter()">
                        <option value="">-- Semua Status --</option>
                        <option value="S">Sudah (S)</option>
                        <option value="B">Belum (B)</option>
                        <option value="P">Pernah (P)</option>
                    </select>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn btn-primary btn-sm w-100" style="background-color: #6366f1; border:none;" onclick="resetFilter()">Reset Filter</button>
                </div>
            </div>
        </div>

        <!-- TABEL DATA -->
        <div class="card card-custom p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center">
                    <span class="me-2 text-muted small">Baris per halaman:</span>
                    <select id="pageSize" class="form-select form-select-sm style-select" style="width: 80px;" onchange="changePageSize()">
                        <option value="10">10</option>
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="500">500</option>
                    </select>
                </div>
                <div id="paginationInfo" class="text-muted small">Memuat data...</div>
            </div>

            <div class="table-container">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th class="text-center">NO</th>
                            <th>DP-ID</th>
                            <th>NKK</th>
                            <th>NIK</th>
                            <th>NAMA</th>
                            <th>TEMPAT / TGL LAHIR</th>
                            <th class="text-center">UMUR</th>
                            <th class="text-center">JK</th>
                            <th class="text-center">STS</th>
                            <th>ALAMAT</th>
                            <th class="text-center">RT</th>
                            <th class="text-center">TPS</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="12" class="text-center py-4 text-muted">
                                <i class="fa-solid fa-spinner fa-spin me-2"></i> Sedang mengambil data Excel...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-end mt-3">
                <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
            </div>
        </div>

    </div>

    <!-- SCRIPT UTAMA METODE PEMBACAAN DAN AKURASI TANGGAL EXCEL -->
    <script>
        let rawData = [];
        let filteredData = [];
        let currentPage = 1;
        let pageSize = 100;
        let chartJKObj = null, chartStatusObj = null, chartUmurObj = null, chartKetObj = null;

        function getValue(row, ...possibleKeys) {
            if (!row) return '';
            const keys = Object.keys(row);
            for (let targetKey of possibleKeys) {
                const cleanTarget = targetKey.toLowerCase().replace(/[^a-z0-9]/g, '');
                for (let k of keys) {
                    const cleanK = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (cleanK === cleanTarget) {
                        let val = row[k];
                        return (val !== undefined && val !== null) ? val : '';
                    }
                }
            }
            return '';
        }

        // KONVERSI TANGGAL EXCEL SERIAL (AKURAT BAZAAR SHEETJS / JS DATE)
        function formatTanggal(val) {
            if (!val) return '';

            if (val instanceof Date) {
                let d = String(val.getDate()).padStart(2, '0');
                let m = String(val.getMonth() + 1).padStart(2, '0');
                let y = val.getFullYear();
                return `${d}/${m}/${y}`;
            }

            let str = String(val).trim();

            if (str.includes('-') || str.includes('/')) {
                if (str.includes('T')) str = str.split('T')[0];
                let parts = str.split(/[-/]/);
                if (parts.length === 3) {
                    if (parts[0].length === 4) {
                        return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
                    }
                }
                return str.replace(/-/g, '/');
            }

            let num = Number(str);
            if (!isNaN(num) && num > 1000 && num < 60000) {
                if (window.XLSX && XLSX.SSF) {
                    return XLSX.SSF.format("dd/mm/yyyy", num);
                }
            }

            return str;
        }

        function formatTTL(tempat, tgl) {
            let tglFormatted = formatTanggal(tgl);
            let tempatStr = String(tempat || '').trim();
            
            if (tempatStr && tglFormatted) {
                return `${tempatStr}, ${tglFormatted}`;
            }
            return tempatStr || tglFormatted || '-';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const fileNames = ['data.xlsx', 'data_2.xlsx'];
            
            function tryFetch(index) {
                if (index >= fileNames.length) {
                    document.getElementById('tableBody').innerHTML = `
                        <tr>
                            <td colspan="12" class="text-center text-danger py-4">
                                <strong>Gagal memuat file Excel.</strong> Pastikan file tersimpan dengan nama <code>data.xlsx</code> di repository.
                            </td>
                        </tr>`;
                    return;
                }

                fetch(fileNames[index])
                    .then(res => {
                        if (!res.ok) throw new Error('File not found');
                        return res.arrayBuffer();
                    })
                    .then(buffer => {
                        const workbook = XLSX.read(buffer, { type: 'array', cellDates: true, cellNF: true });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        rawData = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: true });
                        
                        initDropdowns();
                        applyFilter();
                        initCharts();
                    })
                    .catch(() => tryFetch(index + 1));
            }

            tryFetch(0);
        });

        function initDropdowns() {
            const rtSet = new Set();
            const tpsSet = new Set();

            rawData.forEach(row => {
                let rt = getValue(row, 'RT', 'RT KTP');
                let tps = getValue(row, 'TPS', 'KETERANGAN', 'KET');
                if (rt) rtSet.add(String(rt).trim());
                if (tps) tpsSet.add(String(tps).trim());
            });

            const filterRT = document.getElementById('filterRT');
            filterRT.innerHTML = '<option value="">-- Semua RT --</option>';
            Array.from(rtSet).sort((a,b)=>a-b).forEach(rt => {
                filterRT.innerHTML += `<option value="${rt}">RT ${rt}</option>`;
            });

            const filterKet = document.getElementById('filterKet');
            filterKet.innerHTML = '<option value="">-- Semua TPS --</option>';
            Array.from(tpsSet).sort((a,b)=>a-b).forEach(tps => {
                filterKet.innerHTML += `<option value="${tps}">TPS ${tps}</option>`;
            });
        }

        function applyFilter() {
            const cari = document.getElementById('filterCari').value.toLowerCase();
            const jk = document.getElementById('filterJK').value.toUpperCase();
            const rt = document.getElementById('filterRT').value;
            const tps = document.getElementById('filterKet').value;
            const status = document.getElementById('filterStatus').value.toUpperCase();

            filteredData = rawData.filter(row => {
                const rowNama = String(getValue(row, 'NAMA')).toLowerCase();
                const rowNik = String(getValue(row, 'NIK')).toLowerCase();
                const rowNkk = String(getValue(row, 'NKK')).toLowerCase();
                const rowAlamat = String(getValue(row, 'DUSUN/ALAMAT', 'ALAMAT')).toLowerCase();
                const rowDpId = String(getValue(row, 'DP-ID', 'DP_ID', 'DPID', 'NO DP')).toLowerCase();

                const matchesCari = !cari || 
                    rowNama.includes(cari) ||
                    rowNik.includes(cari) ||
                    rowNkk.includes(cari) ||
                    rowAlamat.includes(cari) ||
                    rowDpId.includes(cari);

                const rowJK = String(getValue(row, 'JENIS KELAMIN', 'JK')).toUpperCase();
                const rowRT = String(getValue(row, 'RT', 'RT KTP')).trim();
                const rowTPS = String(getValue(row, 'TPS', 'KETERANGAN', 'KET')).trim();
                const rowStatus = String(getValue(row, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase();

                const matchesJK = !jk || rowJK === jk;
                const matchesRT = !rt || rowRT === rt;
                const matchesTPS = !tps || rowTPS === tps;
                const matchesStatus = !status || rowStatus === status;

                return matchesCari && matchesJK && matchesRT && matchesTPS && matchesStatus;
            });

            currentPage = 1;
            renderTable();
            updateCharts();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" class="text-center py-4 text-muted">Data tidak ditemukan.</td></tr>`;
                document.getElementById('paginationInfo').innerText = 'Menampilkan 0 data';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, filteredData.length);
            const pageData = filteredData.slice(startIdx, endIdx);

            pageData.forEach((row, index) => {
                const dpId = getValue(row, 'DP-ID', 'DP_ID', 'DPID') || '-';
                const nkk = getValue(row, 'NKK') || '-';
                const nik = getValue(row, 'NIK') || '-';
                const nama = getValue(row, 'NAMA') || '-';
                
                const tempatLahir = getValue(row, 'TEMPAT LAHIR', 'TEMPAT_LAHIR');
                const tglLahir = getValue(row, 'TANGGAL LAHIR', 'TANGGAL_LAHIR', 'TGL LAHIR');
                const ttl = formatTTL(tempatLahir, tglLahir);

                const umur = getValue(row, 'USIA', 'UMUR') || '-';
                const jk = String(getValue(row, 'JENIS KELAMIN', 'JK')).toUpperCase() || '-';
                const sts = String(getValue(row, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase() || '-';
                const alamat = getValue(row, 'DUSUN/ALAMAT', 'ALAMAT') || '-';
                const rt = getValue(row, 'RT', 'RT KTP') || '-';
                const tps = getValue(row, 'TPS', 'KETERANGAN', 'KET') || '-';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center text-muted">${startIdx + index + 1}</td>
                    <td class="text-dp-id">${dpId}</td>
                    <td>${nkk}</td>
                    <td>${nik}</td>
                    <td class="fw-bold">${nama}</td>
                    <td>${ttl}</td>
                    <td class="text-center">${umur}</td>
                    <td class="text-center"><span class="badge ${jk === 'P' ? 'badge-jk-p' : 'badge-jk-l'}">${jk}</span></td>
                    <td class="text-center"><span class="badge badge-sts">${sts}</span></td>
                    <td>${alamat}</td>
                    <td class="text-center">${rt}</td>
                    <td class="text-center"><span class="badge badge-ket">TPS ${tps}</span></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('paginationInfo').innerText = `Menampilkan ${startIdx + 1} - ${endIdx} dari ${filteredData.length} data`;
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            let prevClass = currentPage === 1 ? 'disabled' : '';
            pagination.innerHTML += `<li class="page-item ${prevClass}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Prev</a></li>`;

            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                let activeClass = currentPage === i ? 'active' : '';
                pagination.innerHTML += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="changePage(${i})">${i}</a></li>`;
            }

            let nextClass = currentPage === totalPages ? 'disabled' : '';
            pagination.innerHTML += `<li class="page-item ${nextClass}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Next</a></li>`;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderTable();
            }
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('pageSize').value);
            currentPage = 1;
            renderTable();
        }

        function resetFilter() {
            document.getElementById('filterCari').value = '';
            document.getElementById('filterJK').value = '';
            document.getElementById('filterRT').value = '';
            document.getElementById('filterKet').value = '';
            document.getElementById('filterStatus').value = '';
            applyFilter();
        }

        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(filteredData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data_Pemilih");
            XLSX.writeFile(wb, "Data_Pemilih_Filtered.xlsx");
        }

        function exportCSV() {
            const ws = XLSX.utils.json_to_sheet(filteredData);
            const csv = XLSX.utils.sheet_to_csv(ws);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "Data_Pemilih_Filtered.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function initCharts() {
            chartJKObj = new Chart(document.getElementById('chartJK'), {
                type: 'doughnut',
                data: { labels: ['Laki-Laki', 'Perempuan'], datasets: [{ data: [0, 0], backgroundColor: ['#3b82f6', '#ec4899'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });

            chartStatusObj = new Chart(document.getElementById('chartStatus'), {
                type: 'doughnut',
                data: { labels: ['Sudah (S)', 'Belum (B)', 'Pernah (P)'], datasets: [{ data: [0, 0, 0], backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });

            chartUmurObj = new Chart(document.getElementById('chartUmur'), {
                type: 'bar',
                data: { labels: ['< 20th', '20-39th', '40-59th', '>= 60th'], datasets: [{ label: 'Jumlah', data: [0,0,0,0], backgroundColor: '#10b981' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            chartKetObj = new Chart(document.getElementById('chartKet'), {
                type: 'bar',
                data: { labels: [], datasets: [{ label: 'Jumlah', data: [], backgroundColor: '#6366f1' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            updateCharts();
        }

        function updateCharts() {
            if (!chartJKObj) return;

            let l = filteredData.filter(d => String(getValue(d, 'JENIS KELAMIN', 'JK')).toUpperCase() === 'L').length;
            let p = filteredData.filter(d => String(getValue(d, 'JENIS KELAMIN', 'JK')).toUpperCase() === 'P').length;
            chartJKObj.data.datasets[0].data = [l, p];
            chartJKObj.update();

            let s = filteredData.filter(d => String(getValue(d, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase() === 'S').length;
            let b = filteredData.filter(d => String(getValue(d, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase() === 'B').length;
            let pr = filteredData.filter(d => String(getValue(d, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase() === 'P').length;
            chartStatusObj.data.datasets[0].data = [s, b, pr];
            chartStatusObj.update();

            let u20 = 0, u40 = 0, u60 = 0, uOld = 0;
            filteredData.forEach(d => {
                let u = parseInt(getValue(d, 'USIA', 'UMUR'));
                if (!isNaN(u)) {
                    if (u < 20) u20++;
                    else if (u < 40) u40++;
                    else if (u < 60) u60++;
                    else uOld++;
                }
            });
            chartUmurObj.data.datasets[0].data = [u20, u40, u60, uOld];
            chartUmurObj.update();

            let tpsCounts = {};
            filteredData.forEach(d => {
                let tps = getValue(d, 'TPS', 'KETERANGAN', 'KET');
                if (tps) {
                    let label = "TPS " + String(tps).trim();
                    tpsCounts[label] = (tpsCounts[label] || 0) + 1;
                }
            });
            chartKetObj.data.labels = Object.keys(tpsCounts);
            chartKetObj.data.datasets[0].data = Object.values(tpsCounts);
            chartKetObj.update();
        }
    </script>
</body>
</html>

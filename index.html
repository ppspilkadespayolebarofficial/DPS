<script>
    let rawData = [];
    let filteredData = [];
    let currentPage = 1;
    let pageSize = 100;
    let chartJKObj = null, chartStatusObj = null, chartUmurObj = null;

    const isMasked = true;

    function maskIdentity(str) {
        if (!str) return '-';
        let cleanStr = String(str).replace(/\D/g, '').trim(); 
        
        if (!isMasked || cleanStr.length < 10) {
            return str || '-';
        }

        let prefix = cleanStr.substring(0, 6);
        let suffix = cleanStr.substring(cleanStr.length - 4);
        return `${prefix}xxxxxx${suffix}`;
    }

    function getValue(row, ...possibleKeys) {
        if (!row) return '';
        const keys = Object.keys(row);
        for (let targetKey of possibleKeys) {
            const cleanTarget = targetKey.toLowerCase().replace(/[^a-z0-9]/g, '');
            for (let k of keys) {
                const cleanK = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (cleanK === cleanTarget) {
                    let val = row[k];
                    return (val !== undefined && val !== null) ? val : '';
                }
            }
        }
        return '';
    }

    // FUNGSI TANGGAL YANG DIPERBAIKI SECARA PRESISI
    function formatTanggal(val) {
        if (!val) return '';
        
        // Jika sudah objek Date
        if (val instanceof Date) {
            let d = String(val.getDate()).padStart(2, '0');
            let m = String(val.getMonth() + 1).padStart(2, '0');
            let y = val.getFullYear();
            return `${d}/${m}/${y}`;
        }
        
        let str = String(val).trim();
        if (!str) return '';

        // Tangani format teks hasil bawaan SheetJS (misal: "7/17/66", "11/26/1986", "2026-08-14")
        if (str.includes('/') || str.includes('-')) {
            if (str.includes('T')) str = str.split('T')[0];
            let parts = str.split(/[\/-]/);
            
            if (parts.length === 3) {
                let p1 = parseInt(parts[0], 10);
                let p2 = parseInt(parts[1], 10);
                let p3 = parseInt(parts[2], 10);

                let day, month, year;

                // Format YYYY-MM-DD
                if (parts[0].length === 4) {
                    year = p1;
                    month = p2;
                    day = p3;
                } else {
                    // Format M/D/YY atau M/D/YYYY dari Excel (US style)
                    // Jika angka kedua > 12, pasti itu adalah HARI (p2 = day, p1 = month)
                    if (p2 > 12) {
                        month = p1;
                        day = p2;
                    } else if (p1 > 12) {
                        day = p1;
                        month = p2;
                    } else {
                        // Default fallback untuk M/D/YY bawaan Excel US
                        month = p1;
                        day = p2;
                    }

                    year = p3;
                    // Konversi tahun 2 digit (misal: '66' -> 1966, '06' -> 2006)
                    if (year < 100) {
                        year = (year > 30) ? 1900 + year : 2000 + year;
                    }
                }

                if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                    let dStr = String(day).padStart(2, '0');
                    let mStr = String(month).padStart(2, '0');
                    return `${dStr}/${mStr}/${year}`;
                }
            }
        }

        // Tangani angka Serial Number Excel jika berupa angka murni
        let num = Number(str);
        if (!isNaN(num) && num > 1000 && num < 60000) {
            if (window.XLSX && XLSX.SSF) {
                return XLSX.SSF.format("dd/mm/yyyy", num);
            }
        }

        return str;
    }

    function formatTTL(tempat, tgl) {
        let tglFormatted = formatTanggal(tgl);
        let tempatStr = String(tempat || '').trim();
        if (tempatStr && tglFormatted) {
            return `${tempatStr}, ${tglFormatted}`;
        }
        return tempatStr || tglFormatted || '-';
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetch('data.xlsx')
            .then(res => {
                if (!res.ok) throw new Error('File not found');
                return res.arrayBuffer();
            })
            .then(buffer => {
                const workbook = XLSX.read(buffer, { type: 'array', cellDates: true });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                let loadedData = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });
                
                rawData = loadedData.sort((a, b) => {
                    let rtA = parseInt(getValue(a, 'RT KTP', 'RT_KTP', 'RT')) || 999;
                    let rtB = parseInt(getValue(b, 'RT KTP', 'RT_KTP', 'RT')) || 999;
                    if (rtA !== rtB) return rtA - rtB;

                    let nkkA = String(getValue(a, 'NKK')).trim();
                    let nkkB = String(getValue(b, 'NKK')).trim();
                    return nkkA.localeCompare(nkkB);
                });

                initDropdowns();
                applyFilter();
                initCharts();
            })
            .catch(err => {
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="13" class="text-center text-danger py-4">
                            <strong>Gagal memuat file Excel.</strong> Pastikan file tersimpan dengan nama <code>data.xlsx</code>.
                        </td>
                    </tr>`;
            });
    });

    function initDropdowns() {
        const rtSet = new Set();
        rawData.forEach(row => {
            let rt = getValue(row, 'RT KTP', 'RT_KTP', 'RT');
            if (rt) rtSet.add(parseInt(rt) || String(rt).trim());
        });

        const filterRT = document.getElementById('filterRT');
        filterRT.innerHTML = '<option value="">-- Semua RT --</option>';
        Array.from(rtSet).sort((a,b)=>a-b).forEach(rt => {
            filterRT.innerHTML += `<option value="${rt}">RT ${rt}</option>`;
        });
    }

    function applyFilter() {
        const cari = document.getElementById('filterCari').value.toLowerCase();
        const jk = document.getElementById('filterJK').value.toUpperCase();
        const rt = document.getElementById('filterRT').value;
        const status = document.getElementById('filterStatus').value.toUpperCase();

        filteredData = rawData.filter(row => {
            const rowNama = String(getValue(row, 'NAMA')).toLowerCase();
            const rowNik = String(getValue(row, 'NIK')).toLowerCase();
            const rowNkk = String(getValue(row, 'NKK')).toLowerCase();
            const rowAlamat = String(getValue(row, 'DUSUN/ALAMAT', 'DUSUN ALAMAT', 'ALAMAT')).toLowerCase();
            const rowDpId = String(getValue(row, 'DP-ID', 'DP_ID', 'DPID', 'NO DP')).toLowerCase();

            const matchesCari = !cari || 
                rowNama.includes(cari) ||
                rowNik.includes(cari) ||
                rowNkk.includes(cari) ||
                rowAlamat.includes(cari) ||
                rowDpId.includes(cari);

            const rowJK = String(getValue(row, 'JENIS KELAMIN', 'JK')).toUpperCase();
            const rowRT = String(getValue(row, 'RT KTP', 'RT_KTP', 'RT')).trim();
            const rowStatus = String(getValue(row, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase();

            const matchesJK = !jk || rowJK === jk;
            const matchesRT = !rt || rowRT === rt;
            const matchesStatus = !status || rowStatus === status;

            return matchesCari && matchesJK && matchesRT && matchesStatus;
        });

        currentPage = 1;
        renderTable();
        updateStats();
        updateCharts();
    }

    function updateStats() {
        const total = filteredData.length;
        const kkSet = new Set();
        let l = 0, p = 0, s = 0, b = 0, pr = 0;

        filteredData.forEach(row => {
            const nkk = getValue(row, 'NKK');
            if (nkk) kkSet.add(String(nkk).trim());

            const jk = String(getValue(row, 'JENIS KELAMIN', 'JK')).toUpperCase();
            if (jk === 'L') l++;
            else if (jk === 'P') p++;

            const sts = String(getValue(row, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase();
            if (sts === 'S') s++;
            else if (sts === 'B') b++;
            else if (sts === 'P') pr++;
        });

        document.getElementById('stTotal').innerText = total.toLocaleString('id-ID');
        document.getElementById('stKK').innerText = kkSet.size.toLocaleString('id-ID');
        document.getElementById('stL').innerText = l.toLocaleString('id-ID');
        document.getElementById('stP').innerText = p.toLocaleString('id-ID');
        document.getElementById('stSudah').innerText = s.toLocaleString('id-ID');
        document.getElementById('stBelum').innerText = b.toLocaleString('id-ID');
        document.getElementById('stPernah').innerText = pr.toLocaleString('id-ID');
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="13" class="text-center py-4 text-muted">Data tidak ditemukan.</td></tr>`;
            document.getElementById('paginationInfo').innerText = 'Menampilkan 0 data';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        const startIdx = (currentPage - 1) * pageSize;
        const endIdx = Math.min(startIdx + pageSize, filteredData.length);
        const pageData = filteredData.slice(startIdx, endIdx);

        let lastNKK = null;

        pageData.forEach((row, index) => {
            const dpId = getValue(row, 'DP-ID', 'DP_ID', 'DPID') || '-';
            const rawNkk = String(getValue(row, 'NKK') || '').trim();
            const rawNik = String(getValue(row, 'NIK') || '').trim();
            
            const maskedNkk = maskIdentity(rawNkk);
            const maskedNik = maskIdentity(rawNik);

            const nama = getValue(row, 'NAMA') || '-';
            
            const tempatLahir = getValue(row, 'TEMPAT LAHIR', 'TEMPAT_LAHIR');
            const tglLahir = getValue(row, 'TANGGAL LAHIR', 'TANGGAL_LAHIR', 'TGL LAHIR');
            const ttl = formatTTL(tempatLahir, tglLahir);

            const umur = getValue(row, 'USIA', 'UMUR') || '-';
            const jk = String(getValue(row, 'JENIS KELAMIN', 'JK')).toUpperCase() || '-';
            const sts = String(getValue(row, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase() || '-';
            const alamat = getValue(row, 'DUSUN/ALAMAT', 'DUSUN ALAMAT', 'ALAMAT') || '-';
            const rtKtp = getValue(row, 'RT KTP', 'RT_KTP', 'RT') || '-';
            const rtDomisili = getValue(row, 'RT DOMISILI', 'RT_DOMISILI') || '-';
            const keterangan = getValue(row, 'KETERANGAN') || '';

            const tr = document.createElement('tr');

            if (index > 0 && rawNkk !== lastNKK) {
                tr.classList.add('nkk-group-border');
            }
            lastNKK = rawNkk;

            tr.innerHTML = `
                <td class="text-center text-muted">${startIdx + index + 1}</td>
                <td class="text-dp-id">${dpId}</td>
                <td class="fw-bold text-dark">${maskedNkk}</td>
                <td>${maskedNik}</td>
                <td class="fw-bold">${nama}</td>
                <td>${ttl}</td>
                <td class="text-center">${umur} thn</td>
                <td class="text-center"><span class="badge ${jk === 'P' ? 'badge-jk-p' : 'badge-jk-l'}">${jk}</span></td>
                <td class="text-center">${sts}</td>
                <td>${alamat}</td>
                <td class="text-center fw-bold">${rtKtp}</td>
                <td class="text-center fw-bold text-primary">${rtDomisili}</td>
                <td>${keterangan}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('paginationInfo').innerText = `Menampilkan ${startIdx + 1} - ${endIdx} dari ${filteredData.length} data`;
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredData.length / pageSize);
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        if (totalPages <= 1) return;

        let prevClass = currentPage === 1 ? 'disabled' : '';
        pagination.innerHTML += `<li class="page-item ${prevClass}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Prev</a></li>`;

        for (let i = 1; i <= Math.min(totalPages, 5); i++) {
            let activeClass = currentPage === i ? 'active' : '';
            pagination.innerHTML += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="changePage(${i})">${i}</a></li>`;
        }

        let nextClass = currentPage === totalPages ? 'disabled' : '';
        pagination.innerHTML += `<li class="page-item ${nextClass}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Next</a></li>`;
    }

    function changePage(page) {
        const totalPages = Math.ceil(filteredData.length / pageSize);
        if (page >= 1 && page <= totalPages) {
            currentPage = page;
            renderTable();
        }
    }

    function changePageSize() {
        pageSize = parseInt(document.getElementById('pageSize').value);
        currentPage = 1;
        renderTable();
    }

    function resetFilter() {
        document.getElementById('filterCari').value = '';
        document.getElementById('filterJK').value = '';
        document.getElementById('filterRT').value = '';
        document.getElementById('filterStatus').value = '';
        applyFilter();
    }

    function initCharts() {
        chartJKObj = new Chart(document.getElementById('chartJK'), {
            type: 'doughnut',
            data: { labels: ['Laki-Laki', 'Perempuan'], datasets: [{ data: [0, 0], backgroundColor: ['#3b82f6', '#ec4899'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });

        chartStatusObj = new Chart(document.getElementById('chartStatus'), {
            type: 'doughnut',
            data: { labels: ['Sudah (S)', 'Belum (B)', 'Pernah (P)'], datasets: [{ data: [0, 0, 0], backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });

        chartUmurObj = new Chart(document.getElementById('chartUmur'), {
            type: 'bar',
            data: { labels: ['< 20th', '20-39th', '40-59th', '>= 60th'], datasets: [{ label: 'Pemilih', data: [0,0,0,0], backgroundColor: '#10b981' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        updateCharts();
    }

    function updateCharts() {
        if (!chartJKObj) return;

        let l = filteredData.filter(d => String(getValue(d, 'JENIS KELAMIN', 'JK')).toUpperCase() === 'L').length;
        let p = filteredData.filter(d => String(getValue(d, 'JENIS KELAMIN', 'JK')).toUpperCase() === 'P').length;
        chartJKObj.data.datasets[0].data = [l, p];
        chartJKObj.update();

        let s = filteredData.filter(d => String(getValue(d, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase() === 'S').length;
        let b = filteredData.filter(d => String(getValue(d, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase() === 'B').length;
        let pr = filteredData.filter(d => String(getValue(d, 'STS KAWIN', 'STS', 'STATUS')).toUpperCase() === 'P').length;
        chartStatusObj.data.datasets[0].data = [s, b, pr];
        chartStatusObj.update();

        let u20 = 0, u40 = 0, u60 = 0, uOld = 0;
        filteredData.forEach(d => {
            let u = parseInt(getValue(d, 'USIA', 'UMUR'));
            if (!isNaN(u)) {
                if (u < 20) u20++;
                else if (u < 40) u40++;
                else if (u < 60) u60++;
                else uOld++;
            }
        });
        chartUmurObj.data.datasets[0].data = [u20, u40, u60, uOld];
        chartUmurObj.update();
    }
</script>
